<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Download Spectra ESS</title>

    <script>
        window.onload = function () {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // Android Devices
            if (/android/i.test(userAgent)) {
                window.location.href =
                    "https://play.google.com/store/apps/details?id=com.spectra.ess&hl=en_IN";
            }

            // Apple Devices
            else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href =
                    "https://apps.apple.com/in/app/spectra-ess-app/id1393935321";
            }

            // Desktop or other devices
            else {
                window.location.href =
                    "https://play.google.com/store/apps/details?id=com.spectra.ess&hl=en_IN";
            }
        };
    </script>
</head>

<body>
    <p>Redirecting to Spectra ESS App...</p>
</body>
</html>
